  <title id="title">Full stack delivery</title>
  <desc id="desc">A diagram showing web and mobile products delivered with APIs, data, and release infrastructure.</desc>
  <rect width="1200" height="420" fill="#27354c"/>
  <rect x="40" y="40" width="1120" height="340" fill="none" stroke="#e8eff8" stroke-opacity=".32"/>
