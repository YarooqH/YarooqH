    <text x="72" y="88" fill="#e8eff8" font-size="16" font-weight="700" letter-spacing="3">FROM INTERFACE TO INFRASTRUCTURE</text>
    <text x="72" y="121" fill="#b6c6d9" font-size="16">Build the product. Ship the product. Keep it running.</text>
  </g>
  <g stroke="#e8eff8" stroke-opacity=".42" stroke-width="2" fill="none"><path d="M305 237H406M621 237H724M939 237H1038"/></g>
  <g fill="#e8eff8"><path d="M395 229l14 8-14 8z"/><path d="M713 229l14 8-14 8z"/><path d="M1027 229l14 8-14 8z"/></g>
